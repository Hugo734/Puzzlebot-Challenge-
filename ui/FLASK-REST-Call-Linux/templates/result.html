const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ─── helpers ─── */
const p2 = n => String(Math.abs(Math.floor(n))).padStart(2,'0');
const fmtTime = ms => { const d=new Date(ms); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
const fmtUp   = s  => `${p2(s/3600)}:${p2((s/60)%60)}:${p2(s%60)}`;

function useNow(ms=1000){
  const [n,setN]=useState(Date.now());
  useEffect(()=>{const id=setInterval(()=>setN(Date.now()),ms);return()=>clearInterval(id);},[ms]);
  return n;
}

function useRoll(gen,len=60,ms=300){
  const [d,setD]=useState(()=>Array.from({length:len},(_,i)=>gen(i)));
  const k=useRef(0);
  const genRef=useRef(gen); genRef.current=gen;
  useEffect(()=>{
    const id=setInterval(()=>{k.current++;setD(a=>[...a.slice(1),genRef.current(k.current)]);},ms);
    return()=>clearInterval(id);
  },[ms]);
  return d;
}

/* ─── Sparkline ─── */
function Spark({data,color='#34d399',h=32}){
  const ref=useRef(null);
  const [w,setW]=useState(120);
  useEffect(()=>{
    if(!ref.current) return;
    const ro=new ResizeObserver(([e])=>setW(Math.max(40,e.contentRect.width)));
    ro.observe(ref.current); return()=>ro.disconnect();
  },[]);
  const pts=data.length?data:[0];
  const lo=Math.min(...pts), hi=Math.max(...pts,lo+.001);
  const px=i=>(i/(pts.length-1||1))*w;
  const py=v=>h-((v-lo)/(hi-lo))*(h-4)-2;
  const path=pts.map((v,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1)).join('');
  const fill=path+` L ${w} ${h} L 0 ${h} Z`;
  const gid='sg'+Math.abs(color.charCodeAt(1));
  return(
    <div ref={ref} style={{width:'100%'}}>
      <svg width={w} height={h} style={{display:'block',overflow:'visible'}}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity=".25"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={fill} fill={`url(#${gid})`}/>
        <path d={path} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/>
        <circle cx={px(pts.length-1)} cy={py(pts[pts.length-1])} r="2.5" fill={color}/>
      </svg>
    </div>
  );
}

/* ─── Key cap ─── */

  return(

}

/* ─── Live map (OccupancyGrid canvas + pose overlay) ─── */
function MapView({pose,waypoints,onAdd,onClear,mapData}){
  const containerRef=useRef(null);
  const canvasRef=useRef(null);
  const [sz,setSz]=useState({w:600,h:420});

  useEffect(()=>{
    if(!containerRef.current) return;
    const ro=new ResizeObserver(([e])=>{
      const r=e.contentRect;
      setSz({w:Math.max(100,r.width),h:Math.max(100,r.height)});
    });
    ro.observe(containerRef.current); return()=>ro.disconnect();
  },[]);

  const hasMap=mapData&&mapData.loaded;

  /* Render OccupancyGrid onto canvas whenever map data changes */
  useEffect(()=>{
    if(!canvasRef.current||!hasMap) return;
    const canvas=canvasRef.current;
    const ctx=canvas.getContext('2d');
    const {width,height,data}=mapData;
    canvas.width=width;
    canvas.height=height;
    const img=ctx.createImageData(width,height);
    for(let row=0;row<height;row++){
      for(let col=0;col<width;col++){
        const v=data[row*width+col];
        /* flip Y: ROS row-0 = world bottom, canvas row-0 = screen top */
        const base=((height-1-row)*width+col)*4;
        if(v===-1){
          img.data[base]=55;img.data[base+1]=58;img.data[base+2]=65;img.data[base+3]=220;
        }else if(v===0){
          img.data[base]=18;img.data[base+1]=20;img.data[base+2]=24;img.data[base+3]=255;
        }else{
          /* occupied (walls) — bright on dark theme */
          img.data[base]=200;img.data[base+1]=205;img.data[base+2]=210;img.data[base+3]=255;
        }
      }
    }
    ctx.putImageData(img,0,0);
  },[mapData,hasMap]);

  /* World → screen coords (with fallback when no map) */
  const FALLBACK_SCALE=50; /* px per metre */
  const w2s=useCallback((wx,wy)=>{
    if(hasMap){
      const {width,height,resolution,origin_x,origin_y}=mapData;
      return[
        (wx-origin_x)/resolution*sz.w/width,
        (height-(wy-origin_y)/resolution)*sz.h/height,
      ];
    }
    return[sz.w/2+wx*FALLBACK_SCALE, sz.h/2-wy*FALLBACK_SCALE];
  },[hasMap,mapData,sz]);

  const handleClick=useCallback((e)=>{
    const r=containerRef.current.getBoundingClientRect();
    const cx=e.clientX-r.left, cy=e.clientY-r.top;
    if(hasMap){
      const {width,height,resolution,origin_x,origin_y}=mapData;
      onAdd({
        x:(cx*width/sz.w)*resolution+origin_x,
        y:((height-cy*height/sz.h))*resolution+origin_y,
      });
    }else{
      onAdd({x:(cx-sz.w/2)/FALLBACK_SCALE, y:(sz.h/2-cy)/FALLBACK_SCALE});
    }
  },[hasMap,mapData,sz,onAdd]);

  const [rpx,rpy]=w2s(pose.x,pose.y);

  return(
    <div ref={containerRef} onClick={handleClick} style={{
      position:'relative',width:'100%',flex:1,
      background:'#0c0c0e',borderRadius:10,overflow:'hidden',cursor:'crosshair',
    }}>
      {/* OccupancyGrid bitmap */}
      <canvas ref={canvasRef} style={{
        position:'absolute',inset:0,width:'100%',height:'100%',
        imageRendering:'pixelated',opacity:hasMap?1:0,
      }}/>

      {/* SVG overlay: grid (fallback), trail, waypoints, robot */}
      <svg width={sz.w} height={sz.h} style={{display:'block',position:'absolute',inset:0}}>
        <defs>
          <pattern id="g1" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,.04)" strokeWidth=".5"/>
          </pattern>
          <pattern id="g2" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,.07)" strokeWidth=".8"/>
          </pattern>
        </defs>
        {!hasMap&&<rect width={sz.w} height={sz.h} fill="url(#g1)"/>}
        {!hasMap&&<rect width={sz.w} height={sz.h} fill="url(#g2)"/>}

        {pose.trail&&pose.trail.length>1&&(
          <polyline fill="none" stroke="rgba(251,191,36,.45)" strokeWidth="1.2" strokeDasharray="2 4"
            points={pose.trail.map(p=>w2s(p.x,p.y).join(',')).join(' ')}/>
        )}

        {waypoints.map((w,i)=>{
          const [wpx,wpy]=w2s(w.x,w.y);
          return(
            <g key={i}>
              <circle cx={wpx} cy={wpy} r="10" fill="none" stroke="var(--accent2)" strokeWidth="1.2"/>
              <circle cx={wpx} cy={wpy} r="3" fill="var(--accent2)"/>
              <text x={wpx+13} y={wpy+3.5} fontSize="9" fontFamily="var(--mono)" fill="var(--accent2)" fontWeight="700">WP{i+1}</text>
            </g>
          );
        })}

        <g transform={`translate(${rpx},${rpy}) rotate(${-pose.theta*180/Math.PI})`}>
          <circle r="15" fill="none" stroke="var(--accent)" strokeWidth=".8" opacity=".4"/>
          <path d="M0,0 L20,-8 L20,8 Z" fill="var(--accent)" opacity=".2"/>
          <line x1="0" y1="0" x2="20" y2="0" stroke="var(--accent)" strokeWidth="1.5"/>
          <circle r="7" fill="var(--accent)"/>
          <circle r="3" fill="#09090b"/>
        </g>
      </svg>

      {/* No-map placeholder */}
      {!hasMap&&(
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',
          alignItems:'center',justifyContent:'center',gap:10,pointerEvents:'none'}}>
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" style={{opacity:.2}}>
            <rect x="2" y="2" width="36" height="36" rx="3" stroke="white" strokeWidth="1.2"/>
            <path d="M8 28 L14 18 L20 24 L27 12 L35 22" stroke="white" strokeWidth="1.2" fill="none"/>
          </svg>
          <span style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:'.12em',
            color:'rgba(255,255,255,.2)'}}>WAITING FOR /map TOPIC</span>
        </div>
      )}

      {/* Top-left HUD */}
      <div style={{position:'absolute',top:10,left:14,fontFamily:'var(--mono)',fontSize:10,
        color:'var(--dim)',letterSpacing:'.08em',pointerEvents:'none'}}>
        <div>/odom · /map{hasMap&&` · ${mapData.width}×${mapData.height}`}</div>
        <div style={{marginTop:3}}>
          x <b style={{color:'var(--text)'}}>{pose.x.toFixed(2)}</b> &nbsp;
          y <b style={{color:'var(--text)'}}>{pose.y.toFixed(2)}</b> &nbsp;
          θ <b style={{color:'var(--text)'}}>{(pose.theta*180/Math.PI).toFixed(1)}°</b>
        </div>
      </div>

      {/* Bottom bar */}
      <div style={{position:'absolute',bottom:10,left:14,right:14,
        display:'flex',justifyContent:'space-between',
        fontFamily:'var(--mono)',fontSize:9.5,color:'var(--mute)',letterSpacing:'.1em'}}>
        <span>
          <span style={{color:'var(--accent2)'}}>●</span> WP
          {hasMap&&<span style={{marginLeft:10,color:'rgba(255,255,255,.25)'}}>
            {mapData.resolution.toFixed(3)} m/px
          </span>}
        </span>
        <span style={{display:'flex',gap:10,alignItems:'center'}}>
          <span>CLICK = ADD WP</span>
          {waypoints.length>0&&(
            <button onClick={e=>{e.stopPropagation();onClear();}} style={{
              background:'transparent',border:'1px solid var(--border2)',color:'var(--dim)',
              fontSize:9,letterSpacing:'.1em',padding:'2px 8px',borderRadius:4,cursor:'pointer'}}>CLEAR</button>
          )}
        </span>
      </div>
    </div>
  );
}

/* ─── 3D Robot Visualization with URDF ─── */
function RobotView3D({pose}){
  const containerRef=useRef(null);
  const sceneRef=useRef({robot:null,renderer:null});
  const [urdfLoaded,setUrdfLoaded]=useState(false);

  useEffect(()=>{
    const el=containerRef.current;
    if(!el) return;

    const THREE=window.THREE;
    const w=el.clientWidth, h=el.clientHeight;

    try {
      const scene=new THREE.Scene();
      scene.background=new THREE.Color(0x0c0c0e);

      const camera=new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
      camera.position.set(0.8, 0.8, 0.8);
      camera.lookAt(0, 0.1, 0);

      const renderer=new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(w, h);
      renderer.setClearColor(0x0c0c0e);
      el.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      scene.add(new THREE.DirectionalLight(0xffffff, 1.0));

      const robotGroup=new THREE.Group();
      scene.add(robotGroup);

      sceneRef.current={robot:robotGroup, renderer, scene, camera};

      /* Try to load URDF */
      fetch('/api/urdf/puzzlebot_with_lifter.urdf.xacro')
        .then(r=>r.text())
        .then(urdfText=>{
          const parser=new DOMParser();
          const doc=parser.parseFromString(urdfText, 'application/xml');
          const meshes=doc.querySelectorAll('mesh');

          let meshesLoaded=0;
          const stlLoader=new THREE.STLLoader();

          meshes.forEach(mesh=>{
            let filename=mesh.getAttribute('filename');
            if(!filename) return;

            filename=filename.replace('package://puzzlebot_description/','').split('/').pop();
            const meshPath=`/api/mesh/${filename}`;

            stlLoader.load(meshPath,
              geo=>{
                const mat=new THREE.MeshPhongMaterial({color:0x888899});
                const m=new THREE.Mesh(geo, mat);
                m.scale.set(0.001, 0.001, 0.001);
                robotGroup.add(m);
                meshesLoaded++;
                if(meshesLoaded===meshes.length) setUrdfLoaded(true);
              },
              null,
              ()=>{
                meshesLoaded++;
                if(meshesLoaded===meshes.length) setUrdfLoaded(true);
              }
            );
          });

          if(meshes.length===0) createFallback();
        })
        .catch(()=>createFallback());

      function createFallback(){
        const base=new THREE.Mesh(
          new THREE.BoxGeometry(0.25, 0.1, 0.20),
          new THREE.MeshPhongMaterial({color:0x34d399})
        );
        base.position.y=0.05;
        robotGroup.add(base);

        const mast=new THREE.Mesh(
          new THREE.BoxGeometry(0.05, 0.25, 0.05),
          new THREE.MeshPhongMaterial({color:0x7aa9ff})
        );
        mast.position.y=0.15;
        robotGroup.add(mast);

        const arrow=new THREE.Mesh(
          new THREE.ConeGeometry(0.04, 0.12, 8),
          new THREE.MeshPhongMaterial({color:0xfbbf24})
        );
        arrow.position.set(0, 0.08, -0.15);
        robotGroup.add(arrow);
      }

      const render=()=>{
        requestAnimationFrame(render);
        renderer.render(scene, camera);
      };
      render();

      return()=>{
        if(el.contains(renderer.domElement)) el.removeChild(renderer.domElement);
        renderer.dispose();
      };
    }catch(e){
      console.error('3D render error:', e);
    }
  },[]);

  useEffect(()=>{
    const {robot}=sceneRef.current;
    if(!robot) return;
    robot.position.x=pose.x;
    robot.position.z=pose.y;
    robot.rotation.y=-pose.theta;
  },[pose]);

  return(
    <div style={{position:'relative',width:'100%',height:300}}>
      <div ref={containerRef} style={{width:'100%',height:'100%',borderRadius:10,overflow:'hidden',background:'#0c0c0e',border:'1px solid var(--border)'}}/>
      {!urdfLoaded&&<div style={{position:'absolute',top:10,left:14,fontFamily:'var(--mono)',fontSize:9,color:'rgba(255,255,255,.3)'}}>Loading URDF...</div>}
    </div>
  );
}

/* ─── Main App ─── */
function App(){
  const [tab,setTab]=useState('camera');
  const [keys,setKeys]=useState({w:false,a:false,s:false,d:false,shift:false});
  const [eStop,setEStop]=useState(false);
  const [teleOpEnabled,setTeleOpEnabled]=useState(false);
  const [pose,setPose]=useState({x:0,y:0,theta:0,trail:[]});
  const [waypoints,setWaypoints]=useState([]);
  const [uptime,setUptime]=useState(0);
  const [vel,setVel]=useState({lin:0,ang:0});
  const [rosConnected,setRosConnected]=useState(false);
  const [mapData,setMapData]=useState({loaded:false});

  const velRef=useRef({lin:0,ang:0});
  const keysRef=useRef(keys);    useEffect(()=>{keysRef.current=keys;},[keys]);
  const eStopRef=useRef(eStop);  useEffect(()=>{eStopRef.current=eStop;},[eStop]);
  const teleOpRef=useRef(teleOpEnabled); useEffect(()=>{teleOpRef.current=teleOpEnabled;},[teleOpEnabled]);
  const maxL=0.6, maxA=1.4;

  /* toggle teleop mode on wrapper */
  useEffect(()=>{
    const endpoint=teleOpEnabled?'/api/teleop/enable':'/api/teleop/disable';
    fetch(endpoint,{method:'POST'}).catch(()=>{});
  },[teleOpEnabled]);

  /* velocity smoothing loop */
  useEffect(()=>{
    let raf, last=performance.now();
    const tick=now=>{
      const dt=Math.min(.05,(now-last)/1000); last=now;
      const k=keysRef.current, st=eStopRef.current, b=k.shift?1.6:1;
      let tL=0, tA=0;
      if(!st){
        if(k.w) tL+=maxL*b;  if(k.s) tL-=maxL*b*.6;
        if(k.a) tA+=maxA;    if(k.d) tA-=maxA;
      }
      const v=velRef.current;
      v.lin+=(tL-v.lin)*Math.min(1,dt*4);
      v.ang+=(tA-v.ang)*Math.min(1,dt*4);
      setVel({lin:v.lin,ang:v.ang});
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[]);

  /* send cmd_vel at 10 Hz (only when teleop is enabled) */
  useEffect(()=>{
    if(!teleOpEnabled) return;
    const id=setInterval(()=>{
      const v=velRef.current;
      fetch('/api/cmd_vel',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({linear:parseFloat(v.lin.toFixed(4)),angular:parseFloat(v.ang.toFixed(4))})
      }).catch(()=>{});
    },100);
    return()=>clearInterval(id);
  },[teleOpEnabled]);

  /* poll odometry */
  useEffect(()=>{
    const id=setInterval(()=>{
      fetch('/api/odom')
        .then(r=>r.json())
        .then(d=>{
          setRosConnected(true);
          setPose(prev=>{
            const moved=Math.hypot(d.x-prev.x,d.y-prev.y)>0.015;
            const trail=moved?[...prev.trail.slice(-200),{x:prev.x,y:prev.y}]:prev.trail;
            return{x:d.x,y:d.y,theta:d.theta,trail};
          });
        })
        .catch(()=>setRosConnected(false));
    },200);
    return()=>clearInterval(id);
  },[]);

  /* poll /map every 3 s */
  useEffect(()=>{
    const fetchMap=()=>{
      fetch('/api/map')
        .then(r=>r.json())
        .then(d=>{if(d.loaded) setMapData(d);})
        .catch(()=>{});
    };
    fetchMap();
    const id=setInterval(fetchMap,3000);
    return()=>clearInterval(id);
  },[]);

  useEffect(()=>{const id=setInterval(()=>setUptime(u=>u+1),1000);return()=>clearInterval(id);},[]);

  /* keyboard handler */
  useEffect(()=>{
    const map={w:'w',a:'a',s:'s',d:'d',
      arrowup:'w',arrowleft:'a',arrowdown:'s',arrowright:'d',shift:'shift'};
    const dn=e=>{
      if(e.code==='Space'){setEStop(v=>!v);e.preventDefault();return;}
      const k=map[e.key.toLowerCase()];
      if(k){setKeys(s=>({...s,[k]:true}));e.preventDefault();}
    };
    const up=e=>{
      const k=map[e.key.toLowerCase()];
      if(k) setKeys(s=>({...s,[k]:false}));
    };
    window.addEventListener('keydown',dn);
    window.addEventListener('keyup',up);
    return()=>{window.removeEventListener('keydown',dn);window.removeEventListener('keyup',up);};
  },[]);

  const now=useNow(1000);
  const linBuf=useRoll(useCallback(()=>Math.abs(velRef.current.lin)+(Math.random()-.5)*.03,[]),60,250);
  const angBuf=useRoll(useCallback(()=>Math.abs(velRef.current.ang)+(Math.random()-.5)*.04,[]),60,250);
  const cpuBuf=useRoll(useCallback((_,k)=>22+Math.sin(k*.3)*9+Math.random()*4,[]),60,400);

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'var(--bg)',color:'var(--text)'}}>

      {/* ── HEADER ── */}
      <header style={{
        display:'flex',alignItems:'center',gap:16,padding:'0 24px',height:56,flexShrink:0,
        borderBottom:'1px solid var(--border)',background:'var(--surface)',
      }}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontFamily:'var(--mono)',fontSize:13,fontWeight:700,
            letterSpacing:'.2em',color:'var(--accent)'}}>PUZZLEBOT</span>
        </div>

        <nav style={{display:'flex',gap:2,marginLeft:16}}>
          {[{id:'map',label:'MAP'},{id:'robot',label:'ROBOT'},{id:'camera',label:'CAMERA'},{id:'teleop',label:'TELEOP'}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              padding:'6px 18px',background:'transparent',cursor:'pointer',
              fontFamily:'var(--mono)',fontSize:10.5,letterSpacing:'.12em',
              fontWeight:tab===t.id?600:400,
              border:`1px solid ${tab===t.id?'var(--accent)':'transparent'}`,
              borderRadius:6,
              color:tab===t.id?'var(--accent)':'var(--mute)',
              transition:'all .15s',
            }}>{t.label}</button>
          ))}
        </nav>

        <div style={{flex:1}}/>

        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <span style={{
            display:'inline-flex',gap:5,alignItems:'center',
            fontFamily:'var(--mono)',fontSize:9,letterSpacing:'.08em',
            color:rosConnected?'var(--accent)':'var(--mute)',
            padding:'3px 8px',borderRadius:999,
            border:`1px solid ${rosConnected?'var(--accent)':'var(--border2)'}`,
          }}>
            <span style={{width:5,height:5,borderRadius:'50%',
              background:rosConnected?'var(--accent)':'var(--mute)',
              animation:rosConnected?'pulse 1.6s ease-in-out infinite':'none'}}/>
            {rosConnected?'ROS2 ONLINE':'ROS2 OFFLINE'}
          </span>
          <span style={{
            display:'inline-flex',gap:6,alignItems:'center',
            fontFamily:'var(--mono)',fontSize:9.5,letterSpacing:'.08em',
            color:teleOpEnabled?'var(--accent2)':'rgba(255,255,255,.2)',
            padding:'4px 10px',borderRadius:999,
            border:`1px solid ${teleOpEnabled?'var(--accent2)':'rgba(255,255,255,.15)'}`,
          }}>
            <span style={{width:6,height:6,borderRadius:'50%',
              background:teleOpEnabled?'var(--accent2)':'rgba(255,255,255,.2)',
              animation:teleOpEnabled?'pulse 1.6s ease-in-out infinite':'none'}}/>
            {teleOpEnabled?'TELEOP ON':'TELEOP OFF'}
          </span>
          <span style={{
            display:'inline-flex',gap:6,alignItems:'center',
            fontFamily:'var(--mono)',fontSize:9.5,letterSpacing:'.08em',
            color:eStop?'var(--danger)':'var(--accent)',
            padding:'4px 10px',borderRadius:999,
            border:`1px solid ${eStop?'var(--danger)':'var(--accent)'}`,
          }}>
            <span style={{width:6,height:6,borderRadius:'50%',
              background:eStop?'var(--danger)':'var(--accent)',
              animation:'pulse 1.6s ease-in-out infinite'}}/>
            {eStop?'E-STOP':'ARMED'}
          </span>
          <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--dim)',
            letterSpacing:'.08em',fontVariantNumeric:'tabular-nums'}}>{fmtTime(now)}</span>
        </div>
      </header>

      {/* ── BODY ── */}
      <div style={{flex:1,minHeight:0,padding:16,display:'flex',flexDirection:'column',gap:12}}>

        {/* ── TAB: MAP ── */}
        {tab==='map'&&(
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:12,minHeight:0}}>
            <MapView pose={pose} waypoints={waypoints} mapData={mapData}
              onAdd={w=>setWaypoints(ws=>[...ws,w])}
              onClear={()=>setWaypoints([])}/>
            <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,flexShrink:0}}>
              <TeleValue label="Position X"   value={pose.x.toFixed(2)} unit="m"     color="var(--accent)"/>
              <TeleValue label="Position Y"   value={pose.y.toFixed(2)} unit="m"     color="var(--accent)"/>
              <TeleValue label="Orientation θ" value={(pose.theta*180/Math.PI).toFixed(1)} unit="°"/>
              <TeleValue label="Lin. Vel"     value={vel.lin.toFixed(2)} unit="m/s"
                color={vel.lin>0.05?'var(--accent)':'var(--dim)'} spark={linBuf}/>
              <TeleValue label="Ang. Vel"     value={vel.ang.toFixed(2)} unit="rad/s"
                color={Math.abs(vel.ang)>0.1?'var(--accent2)':'var(--dim)'} spark={angBuf}/>
            </div>
          </div>
        )}

        {/* ── TAB: ROBOT ── */}
        {tab==='robot'&&(
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:12,minHeight:0}}>
            <RobotView3D pose={pose}/>
            <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,flexShrink:0}}>
              <TeleValue label="Position X"   value={pose.x.toFixed(2)} unit="m"     color="var(--accent)"/>
              <TeleValue label="Position Y"   value={pose.y.toFixed(2)} unit="m"     color="var(--accent)"/>
              <TeleValue label="Orientation θ" value={(pose.theta*180/Math.PI).toFixed(1)} unit="°"/>
              <TeleValue label="Lin. Vel"     value={vel.lin.toFixed(2)} unit="m/s"
                color={vel.lin>0.05?'var(--accent)':'var(--dim)'} spark={linBuf}/>
              <TeleValue label="Ang. Vel"     value={vel.ang.toFixed(2)} unit="rad/s"
                color={Math.abs(vel.ang)>0.1?'var(--accent2)':'var(--dim)'} spark={angBuf}/>
            </div>
          </div>
        )}

        {/* ── TAB: CAMERA ── */}
        {tab==='camera'&&(
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:12,minHeight:0}}>
            <CamView/>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,flexShrink:0}}>
              <TeleValue label="Position X" value={pose.x.toFixed(2)} unit="m"  color="var(--accent)"/>
              <TeleValue label="Position Y" value={pose.y.toFixed(2)} unit="m"  color="var(--accent)"/>
              <TeleValue label="θ"          value={(pose.theta*180/Math.PI).toFixed(1)} unit="°"/>
              <TeleValue label="Uptime"     value={fmtUp(uptime)}/>
            </div>
          </div>
        )}

        {/* ── TAB: TELEOP ── */}
        {tab==='teleop'&&(
          <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,minHeight:0}}>

            {/* left: WASD control */}
            <div style={{
              background:'var(--surface)',border:'1px solid var(--border)',
              borderRadius:10,padding:24,display:'flex',flexDirection:'column',gap:20,
            }}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:'.14em',
                  textTransform:'uppercase',color:'var(--mute)'}}>Control · /cmd_vel</div>
                <button onClick={()=>setTeleOpEnabled(v=>!v)} style={{
                  padding:'4px 10px',borderRadius:6,cursor:'pointer',
                  fontSize:9,fontWeight:600,letterSpacing:'.1em',
                  border:`1px solid ${teleOpEnabled?'var(--accent2)':'var(--border2)'}`,
                  background:teleOpEnabled?'rgba(251,191,36,.12)':'transparent',
                  color:teleOpEnabled?'var(--accent2)':'var(--mute)',
                  transition:'all .15s',
                }}>
                  {teleOpEnabled?'✓ ON':'○ OFF'}
                </button>
              </div>

              <div style={{display:'grid',gridTemplateColumns:'repeat(3,44px)',gap:6,alignSelf:'center'}}>
                <div/><Key k="W" label="FWD"   active={keys.w}/><div/>
                <Key k="A" label="LEFT"  active={keys.a}/>
                <Key k="S" label="REV"   active={keys.s}/>
                <Key k="D" label="RIGHT" active={keys.d}/>
              </div>

              <div style={{fontSize:10,fontFamily:'var(--mono)',letterSpacing:'.1em',
                color:'var(--mute)',textAlign:'center'}}>
                SHIFT = boost · SPACE = E-stop · ↑↓←→ also works
              </div>

              {[
                {l:'LINEAR /cmd_vel.linear.x',  v:vel.lin, max:maxL, c:'var(--accent)'},
                {l:'ANGULAR /cmd_vel.angular.z', v:vel.ang, max:maxA, c:'var(--accent2)', bipolar:true},
              ].map(({l,v,max,c,bipolar})=>(
                <div key={l} style={{display:'flex',flexDirection:'column',gap:5}}>
                  <div style={{display:'flex',justifyContent:'space-between',
                    fontFamily:'var(--mono)',fontSize:9.5,letterSpacing:'.1em',color:'var(--mute)'}}>
                    <span>{l}</span>
                    <span style={{color:'var(--text)',fontVariantNumeric:'tabular-nums'}}>
                      {v>=0?'+':''}{v.toFixed(2)} {bipolar?'rad/s':'m/s'}
                    </span>
                  </div>
                  <div style={{position:'relative',height:6,background:'rgba(255,255,255,.05)',borderRadius:3}}>
                    {bipolar&&<div style={{position:'absolute',left:'50%',top:-2,bottom:-2,width:1,background:'var(--border2)'}}/>}
                    <div style={{
                      position:'absolute',
                      left: bipolar?(v>=0?'50%':`${50+v/max*50}%`):'0',
                      width: bipolar?`${Math.abs(v)/max*50}%`:`${Math.min(100,Math.abs(v)/max*100)}%`,
                      top:0,bottom:0,background:c,borderRadius:3,
                      boxShadow:`0 0 8px ${c}77`,transition:'width .1s,left .1s',
                    }}/>
                  </div>
                </div>
              ))}

              <button onClick={()=>setEStop(v=>!v)} style={{
                padding:'11px',borderRadius:8,cursor:'pointer',
                fontSize:11,fontWeight:700,letterSpacing:'.16em',
                border:`1px solid ${eStop?'var(--danger)':'rgba(248,113,113,.4)'}`,
                background:eStop?'var(--danger)':'transparent',
                color:eStop?'#000':'var(--danger)',
                boxShadow:eStop?'0 0 20px rgba(248,113,113,.5)':'none',
                transition:'all .15s',
              }}>
                {eStop?'◼ STOPPED — CLICK TO ARM':'⏻ EMERGENCY STOP'}
              </button>
            </div>

            {/* right: sensors & lifter */}
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <TeleValue label="Position X" value={pose.x.toFixed(2)} unit="m" color="var(--accent)"/>
                <TeleValue label="Position Y" value={pose.y.toFixed(2)} unit="m" color="var(--accent)"/>
                <TeleValue label="θ"          value={(pose.theta*180/Math.PI).toFixed(1)} unit="°"/>
                <TeleValue label="Uptime"     value={fmtUp(uptime)}/>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <TeleValue label="CPU"      value={cpuBuf[cpuBuf.length-1]?.toFixed(0)||'0'} unit="%" spark={cpuBuf} color="#7aa9ff"/>
                <TeleValue label="Lin. Vel" value={vel.lin.toFixed(2)} unit="m/s" spark={linBuf} color="var(--accent)"/>
              </div>

              {/* lifter controls */}
              <div style={{
                background:'var(--surface)',border:'1px solid var(--border)',
                borderRadius:8,padding:12,display:'flex',flexDirection:'column',gap:8,
              }}>
                <div style={{fontFamily:'var(--mono)',fontSize:9,letterSpacing:'.14em',
                  textTransform:'uppercase',color:'var(--mute)'}}>Lifter</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6}}>
                  <button onClick={()=>{fetch('/api/lifter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'raise'})}).catch(()=>{});}}
                    style={{padding:'8px',borderRadius:6,cursor:'pointer',fontSize:9,fontWeight:600,letterSpacing:'.1em',
                      border:'1px solid rgba(52,211,153,.4)',background:'transparent',color:'var(--accent)',
                      transition:'all .15s',
                    }}>
                    ↑ RAISE
                  </button>
                  <button onClick={()=>{fetch('/api/lifter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'stop'})}).catch(()=>{});}}
                    style={{padding:'8px',borderRadius:6,cursor:'pointer',fontSize:9,fontWeight:600,letterSpacing:'.1em',
                      border:'1px solid rgba(251,191,36,.4)',background:'transparent',color:'var(--accent2)',
                      transition:'all .15s',
                    }}>
                    ⏸ STOP
                  </button>
                  <button onClick={()=>{fetch('/api/lifter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'lower'})}).catch(()=>{});}}
                    style={{padding:'8px',borderRadius:6,cursor:'pointer',fontSize:9,fontWeight:600,letterSpacing:'.1em',
                      border:'1px solid rgba(248,113,113,.4)',background:'transparent',color:'var(--danger)',
                      transition:'all .15s',
                    }}>
                    ↓ LOWER
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* ── FOOTER ── */}
      <footer style={{
        height:32,flexShrink:0,borderTop:'1px solid var(--border)',background:'var(--surface)',
        display:'flex',alignItems:'center',padding:'0 20px',gap:20,
        fontFamily:'var(--mono)',fontSize:10,color:'var(--mute)',letterSpacing:'.06em',
      }}>
        <span>ROS2 HUMBLE</span>
        <span style={{color:teleOpEnabled?'var(--text)':'rgba(255,255,255,.3)'}}>
          /cmd_vel {teleOpEnabled?`${vel.lin.toFixed(2)} m/s · ${vel.ang.toFixed(2)} rad/s`:'DISABLED'}
        </span>
        <span style={{flex:1}}/>
        <span style={{color:teleOpEnabled?'var(--accent2)':'rgba(255,255,255,.3)'}}>
          {teleOpEnabled?'◆ TELEOP':'○ IDLE'}
        </span>
        <span style={{color:eStop?'var(--danger)':'var(--accent)'}}>
          ● {eStop?'STOPPED':'ARMED'}
        </span>
        <span>UPTIME {fmtUp(uptime)}</span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
