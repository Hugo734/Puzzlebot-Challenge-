nav_node:
  ros__parameters:
    # Map and waypoint files
    map_yaml: ~/ros2_maps/warehouse.yaml
    waypoints_yaml: ~/ros2_maps/waypoints.yaml

    # Obstacle inflation radius for A* grid (m).  Was 0.30 — caused
    # waypoints near walls (e.g. vic) to be marked unreachable.  At
    # 0.20 m the robot (≈ 20 cm wide) still has ~10 cm safety margin
    # but tight goals near walls become reachable.
    inflation_radius: 0.20

    # Forward speed (m/s)
    linear_speed: 0.15

    # Pure-pursuit angular PID
    angular_kp: 2.0
    angular_max: 1.2

    # Distance (m) to declare the final goal reached
    goal_tolerance: 0.20

    # Lookahead distance for pure-pursuit (m)
    lookahead_distance: 0.40

    # Control loop rate (Hz)
    control_rate: 10.0

    # Heading alignment at goal
    heading_tolerance: 0.12   # rad (~7°) — in-place rotation stops when within this

    # Bug1 obstacle avoidance
    obstacle_distance: 0.50   # front-arc stop threshold (m) — wider for thin legs
    obstacle_angle_deg: 55.0  # half-angle of front arc (deg)
    wall_follow_dist: 0.45    # target lateral distance from wall while circumnavigating (m)

    # ── Local costmap (rolling LiDAR memory) ──────────────────────────
    # Lets the robot remember recent LiDAR hits over a short horizon so
    # transient noise decays away but persistent obstacles stay marked.
    local_costmap_radius:        2.0   # m — half side of the patch around the robot
    local_costmap_decay_tau:     0.7   # s — exponential decay time constant
    local_costmap_occ_threshold: 0.4   # cell score above which a cell counts as occupied

    # ── Continuous path validity check ────────────────────────────────
    path_validity_lookahead:     3.0   # m of path ahead validated each tick
    path_blocked_hysteresis:     3     # consecutive blocked ticks needed to replan

    # ── 360° safety bubble (emergency STOP) ───────────────────────────
    safety_bubble_radius:        0.25  # m — any scan hit closer than this halts the robot

    # ── Dynamic-obstacle wait policy ──────────────────────────────────
    # When replan fails, wait this long (retrying replan) before falling
    # back to Bug1 wall-following.  Useful for slow-moving people/robots.
    wait_for_clear_timeout:      5.0   # s

# Legacy navigation_node parameters (kept for backward compatibility)
navigation_node:
  ros__parameters:
    goal_tolerance: 0.10
    waypoint_tolerance: 0.15
    inflation_radius: 0.15
    max_linear_vel: 0.3
    max_angular_vel: 1.0
    kp_angular: 1.5
    ki_angular: 0.0
    kd_angular: 0.1
    kp_linear: 0.5
    obstacle_threshold: 0.4
    obstacle_front_angle_deg: 30.0
    wall_follow_distance: 0.3
    control_frequency: 10.0
    stuck_timeout: 10.0
