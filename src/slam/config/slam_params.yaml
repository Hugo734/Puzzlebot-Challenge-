slam_node:
  ros__parameters:
    # ── Grid ─────────────────────────────────────────────────────
    resolution:   0.05          # m/cell (5 cm)
    map_width:    400           # cells  (20 m)
    map_height:   400           # cells  (20 m)

    # Log-odds increments + clamps.  Bias toward "occupied wins"
    # (l_occ / |l_free| ≈ 2.5×) so distant walls don't get voted out
    # by grazing free-rays.  Asymmetric clamps mean occupied
    # remembers longer than free, so once a wall is established it
    # survives being briefly out of view.
    l_occ:        0.50
    l_free:      -0.20
    l_min:       -2.0
    l_max:        3.5

    # Display thresholds for to_ros_data() — higher evidence required
    # to classify a cell as occupied/free in the published map.
    display_l_occ:   1.5
    display_l_free: -0.8

    # ── Scan filtering ───────────────────────────────────────────
    range_min:   0.12
    range_max:   10.0

    # Process every Nth ray (1 = all, higher = faster).  10 Hz LiDAR
    # gives us little time per scan; ray_step ≥ 2 leaves more budget
    # for ICP + KDTree + normals.
    ray_step: 2

    # ── Map publish cadence ──────────────────────────────────────
    map_publish_every: 5

    # ── Map-update gating ────────────────────────────────────────
    # Minimum motion before integrating a scan — suppresses
    # stationary jitter.
    min_delta_xy:    0.05   # m
    min_delta_theta: 0.05   # rad (~3°)
    # Force an integration when the scan itself changes by this
    # much (RMS range delta) even if odom says we haven't moved —
    # catches silent odom drift / wheel slip.
    min_scan_diff:   0.07   # m

    # ── ICP scan matcher ─────────────────────────────────────────
    use_icp:                true
    icp_max_iter:           25
    # 5 mm per-iteration tolerance.  At 1e-4 m (0.1 mm) point-to-line ICP
    # often hits max_iter without flagging converged=True even when the
    # fitness is already at the LiDAR noise floor, which used to cause
    # false rejections.  Acceptance is now driven by fitness alone, but
    # we still loosen this so the convergence flag is informative again.
    icp_tolerance:          0.005
    icp_reject_dist:        0.5     # generous for noisy real LiDAR
    icp_min_points:         25
    icp_max_fitness:        0.25    # hard ceiling on RMS inlier error (m)

    # Point-to-line ICP (much more stable on long walls + corners)
    icp_use_point_to_line:  true
    icp_normal_neighbors:   8

    # Scan-to-map matcher
    icp_map_radius:         6.0     # m disc around robot
    icp_map_occ_threshold: -1.0     # -1 → use display_l_occ
    icp_map_voxel:          0.10    # m — downsample map cloud to this voxel
    icp_map_max_pts:        3000    # cap on map cloud size (random subsample)

    # Scan accumulation buffer (fallback ICP target when the map
    # is too sparse — e.g. at startup)
    icp_scan_accum_n:       4

    # Adaptive quality gate: median of recent successful fitness
    # values × factor, clamped to icp_max_fitness on top and 0.05 m
    # on the bottom.  Tighter than a fixed threshold when the
    # robot is matching well, looser when LiDAR noise spikes.
    icp_fitness_gate_factor: 3.0
    icp_fitness_history_n:   20

    # Pose-jump rejection — at 10 Hz scans, anything bigger than
    # this between successive scans is almost certainly a wrong
    # association.
    icp_jump_xy_max:        0.30   # m   (= 3 m/s for one scan period)
    icp_jump_theta_max:     0.40   # rad (~23° per scan)

    # FFT polar correlation pre-alignment — gives ICP a good
    # rotation init when the robot is turning fast (10 Hz can lose
    # 5–15° per scan otherwise).
    icp_fft_prealign:       true
    icp_fft_max_angle_deg:  30.0   # discard FFT estimate if it exceeds this

    # Recovery: after N consecutive bad ICP iterations, run a
    # particle filter over the local map cloud and snap to the
    # best-scoring hypothesis.
    recovery_bad_streak:    5
    pf_n_particles:         40
    pf_xy_spread:           0.20   # m  std-dev of xy perturbation
    pf_theta_spread:        0.20   # rad std-dev of θ perturbation
    pf_sigma:               0.15   # m  kernel bandwidth in the score

    # ── TF smoothing ─────────────────────────────────────────────
    # EMA on the published map→odom transform.  Setting this < 1.0
    # damps per-scan jitter but introduces a lag during fast
    # rotations: because odom→base_footprint updates immediately
    # while map→odom lags, RViz sees the lidar scan rotating
    # relative to the map.  1.0 = no smoothing (default).
    tf_smoothing_alpha: 1.0

    # ── Initial map orientation ──────────────────────────────────
    # Rotate the map frame at startup so the room appears axis-
    # aligned even if the robot doesn't start facing X.
    map_initial_heading: 0.0

    # Fine-trim on the TF-resolved laser mounting yaw.
    # Positive = CCW correction in map view.
    laser_yaw_trim: 0.0

    # ── Base frame (TF) ──────────────────────────────────────────
    base_frame: base_link
