slam_node:
  ros__parameters:
    # ── Grid ─────────────────────────────────────────────────────
    resolution:   0.05          # m/cell (5 cm)
    map_width:    400           # cells  (20 m)
    map_height:   400           # cells  (20 m)

    # Log-odds increments + clamps.
    #
    # Tuning principle (revised for crisp walls):
    #   * l_occ / |l_free| ≈ 2.5×  → wall pixels accumulate faster than
    #     they erode, so distant walls survive occasional grazing rays.
    #   * l_max is LOW (2.5) on purpose: ghost cells produced by a brief
    #     mis-aligned scan saturate fast at 2.5, then a handful of
    #     subsequent free-rays through them are enough to push them
    #     below display_l_free → they disappear from the published map.
    #     With the previous l_max=3.5 ghosts took ~4× longer to clear.
    #   * l_min is symmetric-ish so free regions also recover quickly if
    #     a transient obstacle (person walking through) is removed.
    l_occ:        0.50
    l_free:      -0.20
    l_min:       -1.5
    l_max:        2.5

    # Display thresholds for to_ros_data() — separate from the update
    # increments so we can require MORE evidence to commit a cell to a
    # displayed classification than the update process uses internally.
    # Raised so only multi-hit walls (≥ 4 hits) appear as occupied —
    # single-scan smears never reach this and stay "unknown" (grey).
    display_l_occ:   2.0
    display_l_free: -1.0

    # ── Scan filtering ───────────────────────────────────────────
    range_min:   0.12
    range_max:   10.0

    # Process every Nth ray (1 = all, higher = faster).  Using all rays
    # gives the densest, crispest wall traces in the grid — the per-scan
    # budget is comfortable with the cached matcher target (KDTree +
    # normals built once per map change, not per scan), so ray_step=1
    # is the default.  Bump to 2 only if the Jetson Nano can't keep up
    # at 10 Hz.
    ray_step: 1

    # ── Map publish cadence ──────────────────────────────────────
    map_publish_every: 5

    # ── Map-update gating ────────────────────────────────────────
    # Minimum motion before integrating a scan.  Looser than the
    # angular gate below — we WANT lots of scans integrated during
    # slow translation so the walls accumulate evidence quickly.
    min_delta_xy:    0.02   # m
    min_delta_theta: 0.02   # rad (~1.1°)
    # Force an integration when the scan itself changes by this
    # much (RMS range delta) even if odom says we haven't moved —
    # catches silent odom drift / wheel slip.
    min_scan_diff:   0.05   # m

    # Skip log-odds integration when |ω| exceeds this threshold.
    # The per-ray deskew assumes ω is constant within the scan
    # period (~100 ms); above ~0.6 rad/s that assumption breaks
    # down and integrating a sheared scan produces double-walls /
    # smearing in the published map.  The scan matcher still runs
    # on every scan, so the pose stays accurate — we just don't
    # WRITE to the grid until the robot finishes turning.  Set to
    # 0 to disable.
    map_update_omega_max: 0.6   # rad/s (~34°/s)

    # ── ICP scan matcher ─────────────────────────────────────────
    use_icp:                true
    icp_max_iter:           25
    icp_tolerance:          0.005
    icp_reject_dist:        0.45    # tighter inlier gate (was 0.5)
    # Inlier-count gate: ICP only accepts a match if at least this many
    # scan points fell within reject_dist of the map.  Tuned to ~25%
    # of a sub-sampled scan (180 points × ray_step=2): real matches
    # in this room consistently exceed 45 inliers; spurious matches
    # rarely clear it.
    icp_min_points:         45
    # RMS-of-inlier-distance ceiling.  Real matches in this room are
    # ~0.13-0.17 m; 0.20 m gives margin for residual slip + noise.
    icp_max_fitness:        0.20

    # Point-to-line ICP (much more stable on long walls + corners)
    icp_use_point_to_line:  true
    icp_normal_neighbors:   8

    # Scan-to-map matcher
    icp_map_radius:         6.0     # m disc around robot
    icp_map_occ_threshold: -1.0     # -1 → use display_l_occ
    icp_map_voxel:          0.10    # m — downsample map cloud to this voxel
    icp_map_max_pts:        3000    # cap on map cloud size (random subsample)

    # Scan accumulation buffer (fallback ICP target when the map
    # is too sparse — e.g. at startup)
    icp_scan_accum_n:       4

    # Adaptive quality gate: median of recent successful fitness
    # values × factor, clamped to icp_max_fitness on top and 0.20 m
    # on the bottom (3× resolution).  Loosened from 3.0× → 5.0× now
    # that the matcher runs on every scan: in-motion fitness is
    # naturally higher than stationary fitness, and the tighter gate
    # was rejecting otherwise-good moving matches.
    icp_fitness_gate_factor: 5.0
    icp_fitness_history_n:   30

    # Pose-jump rejection.  These limits used to be tight because the
    # matcher only ran during keyframes (stationary moments) and a big
    # delta between two stationary samples really was a bad match.  With
    # keyframe_mode off, the matcher runs on EVERY scan AND the FIRST
    # match after odometry drift accumulates may legitimately need to
    # snap back a sizeable correction — so we widen the limits.
    icp_jump_xy_max:        0.60   # m   (= 6 m/s for one scan period)
    icp_jump_theta_max:     0.70   # rad (~40° per scan)

    # FFT polar correlation pre-alignment — gives ICP a good
    # rotation init when the robot is turning fast (10 Hz can lose
    # 5–15° per scan otherwise).
    icp_fft_prealign:       true
    icp_fft_max_angle_deg:  30.0   # discard FFT estimate if it exceeds this

    # Recovery: after N consecutive bad ICP iterations, run a
    # particle filter over the local map cloud and snap to the
    # best-scoring hypothesis.
    recovery_bad_streak:    5
    pf_n_particles:         40
    pf_xy_spread:           0.20   # m  std-dev of xy perturbation
    pf_theta_spread:        0.20   # rad std-dev of θ perturbation
    pf_sigma:               0.15   # m  kernel bandwidth in the score

    # ── Correlative Scan Matcher (coarse-to-fine grid search) ────
    # Search WINDOWS are deliberately narrow.  Wheel odometry rotation
    # is highly reliable over a single 100 ms scan period (≪ 1° error),
    # so giving CSM a ±17° window — as the original tuning did — was an
    # invitation to pick a wrong local maximum 10° away from reality.
    # ±5.7° is enough margin for any plausible per-scan odom error;
    # together with the rot-clamp below the matcher cannot run away
    # rotationally even when the map is sparse or symmetric.
    csm_enabled:            true
    csm_coarse_xy_radius:   0.40    # m
    csm_coarse_xy_step:     0.10    # m  (= 2 cells)
    csm_coarse_th_radius:   0.10    # rad (~5.7°)
    csm_coarse_th_step:     0.025   # rad (~1.4°)
    csm_fine_xy_radius:     0.10    # m
    csm_fine_xy_step:       0.02    # m
    csm_fine_th_radius:     0.025   # rad (~1.4°)
    csm_fine_th_step:       0.005   # rad (~0.29°)
    # CSM acceptance score: sum of (clamped-positive) log-odds at the
    # cells under the scan rays.  In this room real matches score
    # 130-300; pure-noise alignments rarely exceed 50.  90 sits in
    # the safe gap.
    csm_min_score:          90.0
    # Min occupied cells in the local map disc before CSM is used.
    # 30 was tuned for fresh-map bootstrap; in localization mode the
    # preloaded map already has hundreds of cells, so we can stay at
    # 30 (CSM engages immediately).
    csm_min_occupied_cells: 30

    # ── Rotation correction clamp (rotation drift safety net) ────
    # Hard limit on |Δθ_matcher − Δθ_odom| per scan, in degrees.
    # Loosened to match continuous-matching mode: when the matcher
    # runs every scan, the corrections per scan stay small in
    # practice, but the FIRST scan that catches up after a brief
    # ICP miss must be allowed to apply a real fix.
    rot_clamp_stationary_deg: 12.0
    rot_clamp_slow_deg:        6.0
    rot_clamp_fast_deg:        3.0
    rot_clamp_slow_omega:      0.20   # rad/s (~11°/s)
    rot_clamp_fast_omega:      0.60   # rad/s (~34°/s)

    # ── Keyframe mode ────────────────────────────────────────────
    # When TRUE, the scan matcher AND the map update only run while
    # the robot is physically stationary.  Intended as a defence
    # against wheel-slip on slippery floors, but in practice it means
    # the matcher is OFF whenever you're driving — so wheel-odom
    # drift accumulates without correction, and the very first match
    # after stopping has to fix a large error that the pose-jump /
    # rotation-clamp / fitness gates then reject.  The result is the
    # exact "starts well, then stops correcting" symptom we hit on
    # the real robot.
    #
    # Set FALSE → matcher runs on every scan (continuous matching).
    # Within-scan shear is already handled by the per-ray deskew in
    # scan_to_points(), so we don't need keyframes to avoid it.
    keyframe_mode: false

    # ── Range outlier filter ─────────────────────────────────────
    # RPLidar A1 occasionally emits isolated range spikes (glass,
    # dark cloth, dust).  Rays whose value differs from BOTH polar
    # neighbours by > outlier_max_jump are dropped — true wall
    # edges have only ONE differing neighbour so they survive.
    # Tightened from 0.5 → 0.3 because in this room genuine wall
    # corners produce neighbour-deltas of ≤ 0.25 m at typical ranges,
    # so 0.3 still keeps them while cutting more spurious spikes.
    outlier_filter_enabled: true
    outlier_max_jump:       0.3

    # ── TF smoothing ─────────────────────────────────────────────
    # EMA on the published map→odom transform.  1.0 = no smoothing.
    # With continuous matching (every scan) the per-scan correction
    # is already small and EMA mostly adds lag — set to 1.0 by
    # default.  Drop to 0.6–0.8 only if RViz visualisation jitters.
    tf_smoothing_alpha: 1.0

    # ── Initial map orientation ──────────────────────────────────
    # Rotate the map frame at startup so the room appears axis-
    # aligned even if the robot doesn't start facing X.
    map_initial_heading: 0.0

    # Fine-trim on the TF-resolved laser mounting yaw.
    # Positive = CCW correction in map view.
    laser_yaw_trim: 0.0

    # ── Base frame (TF) ──────────────────────────────────────────
    base_frame: base_link
