lifting_node:
  ros__parameters:
    # Set use_mock_gpio: false when deploying on the Jetson Nano
    use_mock_gpio: true

    # GPIO board pin numbers for 3-bit binary encoding → FPGA
    pin_bit0: 11   # LSB
    pin_bit1: 13
    pin_bit2: 15   # MSB

    # Named operational levels (0–7)
    level_rest: 0         # idle / powered off
    level_transport: 1    # travelling with loaded pallet
    level_pick_floor: 3   # pick pallet from floor / roller
    level_carry: 4        # carrying height
    level_pick_rack2: 5   # pick pallet from rack level 2
    level_max: 7          # maximum height
